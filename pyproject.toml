[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pokemon-battle-rl"
version = "0.1.0"
description = "Controlled opponent-diversity experiments for Pokemon doubles battle policies"
requires-python = ">=3.12,<3.14"
dependencies = [
  "poke-env==0.16.1",
  "numpy>=2,<3",
  "torch>=2.7,<3",
  "gymnasium==1.3.0",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.10,<4",
]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
pokemon-rl = "pokemon_rl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pokemon_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires installed Pokemon Showdown"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
